# ssh-1password registry: one entry per host alias, one key per trust domain.
# THIS FILE IS A TEMPLATE. install copies it to ~/.config/ssh-1password/hosts.yml (outside any
# repository: hostnames are endpoints). Override the location with $SSH_1P_HOSTS or --file.
#
# alias (the mapping key): what you type after "ssh" and what git remotes use
#   (git@github-work:org/repo.git). Several patterns separated by spaces are allowed, as in
#   ssh_config ("pve router npm").
# Fields:
#   key:      REQUIRED. Title of the SSH key item in 1Password, or its SHA256:... fingerprint.
#             Several hosts may share a key (one key per trust domain, not per host).
#   hostname: real host (optional; without it the alias is the real name)
#   user:     SSH login user (optional). NOT your GitHub/GitLab account: those always use "git";
#             your account is identified by the key. Omit it for hosts where your local user matches.
#   port:     port (optional)
#   vault:    1Password vault holding the key (optional; needed only for keys outside your
#             Personal/Private/Employee vault, e.g. a work vault). Written to agent.toml.
#   email:    git identity for repos whose remote uses this alias (optional). install writes a
#             global includeIf so `git commit` in those repos uses it automatically (git 2.36+).
#   name:     git user.name for the same repos (optional, only with email)
#   sign:     SSH commit signing through 1Password for the same repos (optional, only with email).
#             "manual": the key is configured, nothing is signed unless you run `git commit -S` or
#             set `git config commit.gpgsign true` in the repos that require it.
#             "always": every commit and tag of this alias is signed (a repo can opt out with
#             `git config commit.gpgsign false`). Upload the .pub to GitHub/GitLab as a "Signing key".
#   signing_key: title of a dedicated 1Password key item used only for signing (optional, only with
#             sign; default: the same key as for authentication)
#
# After editing: ssh-1password.py install && ssh-1password.py doctor

# github-personal:
#   hostname: github.com
#   user: git                   # always "git" on GitHub/GitLab, whatever your account name is
#   key: GitHub personal

# github-work:
#   hostname: github.com
#   user: git
#   key: GitHub work
#   vault: Work
#   email: me@work.example      # commits in repos cloned via git@github-work:... use this identity
#   name: My Name
#   sign: manual                # signing ready for those repos; sign with -S or per-repo gpgsign

# homelab:
#   hostname: 192.0.2.10
#   user: admin
#   key: Homelab
